name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # CI never talks to real services: skip env validation and use inert,
      # non-secret placeholders for values read at build time.
      SKIP_ENV_VALIDATION: "1"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_WALRUS_EXPLORER_BLOB_URL: https://walruscan.com/mainnet/blob/
      NEXT_PUBLIC_SUI_EXPLORER_OBJECT_URL: https://suiscan.xyz/mainnet/object/
      MEMWAL_ACCOUNT_ID: "0x0"
      MEMWAL_NAMESPACE_PREFIX: coach-ci-v1
      GROQ_MODEL: qwen/qwen3.8-27b
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: ci-only-placeholder-not-a-secret-000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
